name: LLM PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Allow manual triggering for testing

jobs:
  llm-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # COMMENTED OUT: Cache functionality due to permission issues
      # TODO: Fix permission issues for future caching implementation
      # - name: Setup cache for Ollama models
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.ollama
      #     key: ollama-models-${{ runner.os }}-gemma3-1b-v1
      #     restore-keys: |
      #       ollama-models-${{ runner.os }}-
      
      - name: Start Ollama service
        run: |
          echo "Starting Ollama service..."
          # COMMENTED OUT: Volume mount for caching due to permission issues
          # docker run -d \
          #   --name ollama-service \
          #   -p 11434:11434 \
          #   -v ~/.ollama:/root/.ollama \
          #   ollama/ollama:latest
          
          docker run -d \
            --name ollama-service \
            -p 11434:11434 \
            ollama/ollama:latest
          
          echo "Waiting for Ollama service to be ready..."
          timeout 120s bash -c 'until curl -s http://localhost:11434/api/tags >/dev/null 2>&1; do 
            echo "Waiting for Ollama to start..."
            sleep 3
          done'
          echo "Ollama service is ready!"
      
      - name: Check if gemma3:1b model exists
        id: check-model
        run: |
          echo "Checking if gemma3:1b model exists..."
          models=$(curl -s http://localhost:11434/api/tags)
          echo "Available models response: $models"
          
          if echo "$models" | grep -q "gemma3:1b"; then
            echo "model_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Model gemma3:1b already exists"
          else
            echo "model_exists=false" >> $GITHUB_OUTPUT
            echo "❌ Model gemma3:1b not found, will download"
          fi
      
      - name: Download gemma3:1b model if not available
        if: steps.check-model.outputs.model_exists == 'false'
        run: |
          echo "📥 Downloading gemma3:1b model..."
          echo "This may take several minutes depending on network speed..."
          
          # Start the pull request and capture the response
          curl -X POST http://localhost:11434/api/pull \
            -H "Content-Type: application/json" \
            -d '{"name": "gemma3:1b"}' \
            --silent --show-error | while read -r line; do
              if [[ -n "$line" ]]; then
                echo "Download progress: $line"
              fi
            done
          
          echo "✅ Model download completed!"
          
          # Verify the model was downloaded
          echo "Verifying model installation..."
          curl -s http://localhost:11434/api/tags
      
      - name: Get PR diff
        id: get-diff
        run: |
          echo "📄 Getting PR diff..."
          
          # Get the base and head commit SHAs
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          
          # Get the diff
          git fetch origin $BASE_SHA
          git fetch origin $HEAD_SHA
          
          # Generate diff and save to file for processing
          git diff $BASE_SHA..$HEAD_SHA > pr_diff.txt
          
          # Show diff stats
          echo "Diff stats:"
          git diff --stat $BASE_SHA..$HEAD_SHA
          
          # Check if diff file is too large (limit to ~100000 chars based on gemma3:1b 32k token context)
          DIFF_SIZE=$(wc -c < pr_diff.txt)
          echo "Diff size: $DIFF_SIZE characters"
          
          if [ $DIFF_SIZE -gt 100000 ]; then
            echo "⚠️ Diff is large ($DIFF_SIZE chars), truncating to first 100000 characters..."
            head -c 100000 pr_diff.txt > pr_diff_truncated.txt
            mv pr_diff_truncated.txt pr_diff.txt
            echo "...diff truncated due to size" >> pr_diff.txt
          fi
          
          echo "diff_ready=true" >> $GITHUB_OUTPUT
      
      - name: Analyze PR with LLM
        if: steps.get-diff.outputs.diff_ready == 'true'
        run: |
          echo "🔍 Analyzing PR with LLM..."
          
          # Create the prompt using a here-doc
          cat > prompt.txt << EOF
          Please analyze this git diff of a pull request and provide an executive summary in less than 30 words. Focus on the main changes and their purpose.

          Git diff:
          $(cat pr_diff.txt)

          Executive summary (less than 30 words):
          EOF
          
          # Create proper JSON payload using Python
          python3 << 'PYTHON_EOF' > payload.json
          import json
          
          with open('prompt.txt', 'r') as f:
              prompt_content = f.read()
          
          payload = {
              "model": "gemma3:1b",
              "prompt": prompt_content,
              "stream": False
          }
          
          print(json.dumps(payload))
          PYTHON_EOF
          
          echo "Sending request to LLM..."
          
          # Send to LLM
          response=$(curl -s -X POST http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          echo "Raw LLM response: $response"
          echo ""
          
          # Extract and display detailed response information
          if command -v jq >/dev/null 2>&1; then
            summary=$(echo "$response" | jq -r '.response // "No response found"')
            model_used=$(echo "$response" | jq -r '.model // "unknown"')
            created_at=$(echo "$response" | jq -r '.created_at // "unknown"')
            done_status=$(echo "$response" | jq -r '.done // false')
            total_duration=$(echo "$response" | jq -r '.total_duration // "unknown"')
            context=$(echo "$response" | jq -r '.context // []')
          else
            summary=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('response', 'No response found'))
            except:
                print('Failed to parse JSON response')
            ")
            model_used=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('model', 'unknown'))
            except:
                print('unknown')
            ")
            created_at=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('created_at', 'unknown'))
            except:
                print('unknown')
            ")
            done_status=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('done', False))
            except:
                print('false')
            ")
            total_duration=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('total_duration', 'unknown'))
            except:
                print('unknown')
            ")
            context=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                context_tokens = data.get('context', [])
                print(f'Context tokens: {len(context_tokens)} tokens')
                if context_tokens:
                    print('First 10 context tokens:', context_tokens[:10])
                    print('Last 10 context tokens:', context_tokens[-10:])
            except:
                print('No context available')
            ")
          fi
          
          echo "════════════════════════════════════════════"
          echo "📋 PULL REQUEST EXECUTIVE SUMMARY:"
          echo "$summary"
          echo ""
          echo "🔧 Model Used: $model_used"
          echo "⏰ Created At: $created_at"
          echo "✅ Completed: $done_status"
          echo "⏱️ Total Duration: $total_duration"
          echo ""
          echo "🧠 Context Information:"
          echo "$context"
          echo ""
          echo "💬 Full Response for Conversation Continuation:"
          echo "Model: $model_used"
          echo "Response: $summary"
          echo "Context: Available for follow-up questions"
          echo "════════════════════════════════════════════"
      
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up Ollama service..."
          docker stop ollama-service || true
          docker rm ollama-service || true
          
          echo "🧹 Cleaning up temporary files..."
          rm -f pr_diff.txt || true
          rm -f prompt.txt || true
          rm -f payload.json || true
