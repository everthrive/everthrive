name: LLM PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Allow manual triggering for testing
    inputs:
      action_rules:
        description: 'Comma-separated list of specific checks for the LLM to perform'
        required: false
        default: 'Report for very clear error even without context in the diff'
        type: string

permissions:
  contents: read       # To checkout code and read repository contents
  pull-requests: write # To post comments on pull requests
  issues: write        # To post comments (PRs are issues in GitHub API)

env:
  # Default action rules - can be overridden by workflow input
  DEFAULT_ACTION_RULES: 'Report for very clear error even without context in the diff'

jobs:
  llm-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # COMMENTED OUT: Cache functionality due to permission issues
      # TODO: Fix permission issues for future caching implementation
      # - name: Setup cache for Ollama models
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.ollama
      #     key: ollama-models-${{ runner.os }}-gemma3-1b-v1
      #     restore-keys: |
      #       ollama-models-${{ runner.os }}-
      
      - name: Start Ollama service
        run: |
          echo "Starting Ollama service..."
          # COMMENTED OUT: Volume mount for caching due to permission issues
          # docker run -d \
          #   --name ollama-service \
          #   -p 11434:11434 \
          #   -v ~/.ollama:/root/.ollama \
          #   ollama/ollama:latest
          
          docker run -d \
            --name ollama-service \
            -p 11434:11434 \
            ollama/ollama:latest
          
          echo "Waiting for Ollama service to be ready..."
          timeout 120s bash -c 'until curl -s http://localhost:11434/api/tags >/dev/null 2>&1; do 
            echo "Waiting for Ollama to start..."
            sleep 3
          done'
          echo "Ollama service is ready!"
      
      - name: Check if gemma3:1b model exists
        id: check-model
        run: |
          echo "Checking if gemma3:1b model exists..."
          models=$(curl -s http://localhost:11434/api/tags)
          echo "Available models response: $models"
          
          if echo "$models" | grep -q "gemma3:1b"; then
            echo "model_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Model gemma3:1b already exists"
          else
            echo "model_exists=false" >> $GITHUB_OUTPUT
            echo "❌ Model gemma3:1b not found, will download"
          fi
      
      - name: Download gemma3:1b model if not available
        if: steps.check-model.outputs.model_exists == 'false'
        run: |
          echo "📥 Downloading gemma3:1b model..."
          echo "This may take several minutes depending on network speed..."
          
          # Start the pull request and capture the response
          curl -X POST http://localhost:11434/api/pull \
            -H "Content-Type: application/json" \
            -d '{"name": "gemma3:1b"}' \
            --silent --show-error | while read -r line; do
              if [[ -n "$line" ]]; then
                echo "Download progress: $line"
              fi
            done
          
          echo "✅ Model download completed!"
          
          # Verify the model was downloaded
          echo "Verifying model installation..."
          curl -s http://localhost:11434/api/tags
      
      - name: Get PR diff
        id: get-diff
        run: |
          echo "📄 Getting PR diff..."
          
          # Get the base and head commit SHAs
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          
          # Get the diff
          git fetch origin $BASE_SHA
          git fetch origin $HEAD_SHA
          
          # Generate diff and save to file for processing
          git diff $BASE_SHA..$HEAD_SHA > pr_diff.txt
          
          # Show diff stats
          echo "Diff stats:"
          git diff --stat $BASE_SHA..$HEAD_SHA
          
          # Check if diff file is too large (limit to ~100000 chars based on gemma3:1b 32k token context)
          DIFF_SIZE=$(wc -c < pr_diff.txt)
          echo "Diff size: $DIFF_SIZE characters"
          
          if [ $DIFF_SIZE -gt 100000 ]; then
            echo "⚠️ Diff is large ($DIFF_SIZE chars), truncating to first 100000 characters..."
            head -c 100000 pr_diff.txt > pr_diff_truncated.txt
            mv pr_diff_truncated.txt pr_diff.txt
            echo "...diff truncated due to size" >> pr_diff.txt
          fi
          
          echo "diff_ready=true" >> $GITHUB_OUTPUT
      
      - name: Analyze PR with LLM
        if: steps.get-diff.outputs.diff_ready == 'true'
        run: |
          echo "🔍 Analyzing PR with LLM..."
          
          # Determine which action rules to use
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.action_rules }}" ]; then
            ACTION_RULES="${{ github.event.inputs.action_rules }}"
            echo "Using workflow input action rules: $ACTION_RULES"
          else
            ACTION_RULES="$DEFAULT_ACTION_RULES"
            echo "Using default action rules: $ACTION_RULES"
          fi
          
          # Convert comma-separated rules to numbered list for prompt
          echo "Processing action rules..."
          python3 << 'PYTHON_EOF' > action_rules_formatted.txt
          import os
          
          rules_string = os.environ.get('ACTION_RULES', '')
          if rules_string:
              rules = [rule.strip() for rule in rules_string.split(',') if rule.strip()]
              formatted_rules = ""
              for i, rule in enumerate(rules, 1):
                  formatted_rules += f"{i}. {rule}\n"
              print(formatted_rules.strip())
          else:
              print("No action rules provided")
          PYTHON_EOF
          
          export ACTION_RULES="$ACTION_RULES"
          
          # Create the enhanced prompt using a here-doc
          cat > prompt.txt << EOF
          Please analyze this git diff of a pull request and provide a structured response.

          Git diff:
          $(cat pr_diff.txt)

          Please provide your analysis in the following format:

          **EXECUTIVE SUMMARY:** [Provide a concise summary in less than 30 words describing the main changes and their purpose]

          **DETAILED ANALYSIS:**
          $(cat action_rules_formatted.txt)

          For each numbered item above, provide a specific response addressing that concern. Use the format:
          1. [Your response to the first item]
          2. [Your response to the second item]
          (and so on for each item)

          Keep responses concise but informative.
          EOF
          
          # Create proper JSON payload using Python
          python3 << 'PYTHON_EOF' > payload.json
          import json
          
          with open('prompt.txt', 'r') as f:
              prompt_content = f.read()
          
          payload = {
              "model": "gemma3:1b",
              "prompt": prompt_content,
              "stream": False
          }
          
          print(json.dumps(payload))
          PYTHON_EOF
          
          echo "Sending request to LLM..."
          
          # Send to LLM
          response=$(curl -s -X POST http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          echo "Raw LLM response: $response"
          echo ""
          
          # Save response for use in comment step
          echo "$response" > llm_response.json
          
          # Extract and display detailed response information
          if command -v jq >/dev/null 2>&1; then
            summary=$(echo "$response" | jq -r '.response // "No response found"')
            model_used=$(echo "$response" | jq -r '.model // "unknown"')
            created_at=$(echo "$response" | jq -r '.created_at // "unknown"')
            done_status=$(echo "$response" | jq -r '.done // false')
            total_duration=$(echo "$response" | jq -r '.total_duration // "unknown"')
            context=$(echo "$response" | jq -r '.context // []')
          else
            summary=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('response', 'No response found'))
            except:
                print('Failed to parse JSON response')
            ")
            model_used=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('model', 'unknown'))
            except:
                print('unknown')
            ")
            created_at=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('created_at', 'unknown'))
            except:
                print('unknown')
            ")
            done_status=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('done', False))
            except:
                print('false')
            ")
            total_duration=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('total_duration', 'unknown'))
            except:
                print('unknown')
            ")
            context=$(echo "$response" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                context_tokens = data.get('context', [])
                print(f'Context tokens: {len(context_tokens)} tokens')
                if context_tokens:
                    print('First 10 context tokens:', context_tokens[:10])
                    print('Last 10 context tokens:', context_tokens[-10:])
            except:
                print('No context available')
            ")
          fi
          
          echo "════════════════════════════════════════════"
          echo "📋 PULL REQUEST ANALYSIS:"
          echo "$summary"
          echo ""
          echo "🔧 Model Used: $model_used"
          echo "⏰ Created At: $created_at"
          echo "✅ Completed: $done_status"
          echo "⏱️ Total Duration: $total_duration"
          echo ""
          echo "🧠 Context Information:"
          echo "$context"
          echo ""
          echo "💬 Full Response for Conversation Continuation:"
          echo "Model: $model_used"
          echo "Response: $summary"
          echo "Context: Available for follow-up questions"
          echo "════════════════════════════════════════════"
      
      - name: Post summary as PR comment
        if: steps.get-diff.outputs.diff_ready == 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "📝 Posting summary as PR comment..."
          
          # Check if LLM response file exists
          if [ ! -f llm_response.json ]; then
            echo "❌ No LLM response found to post as comment"
            exit 1
          fi
          
          # Debug: Show what we got from LLM
          echo "📋 LLM Response file contents:"
          cat llm_response.json
          echo ""
          
          # Extract and process the LLM response using Python (more robust approach)
          python3 << 'PYTHON_EOF'
          import json
          import re
          import os
          from datetime import datetime
          
          print("🔍 Processing LLM response...")
          
          try:
              # Read LLM response
              with open('llm_response.json', 'r') as f:
                  response_data = json.load(f)
              
              full_response = response_data.get('response', 'No response found')
              model_used = response_data.get('model', 'unknown')
              
              print(f"✅ Successfully read LLM response: {len(full_response)} characters")
              print(f"📱 Model used: {model_used}")
              
              # Get diff size
              try:
                  with open('pr_diff.txt', 'r') as f:
                      diff_size = len(f.read())
              except:
                  diff_size = 0
              
              # Try to parse structured response, but fallback gracefully
              executive_summary = ""
              detailed_analysis = ""
              
              # Look for executive summary
              exec_patterns = [
                  r'\*\*EXECUTIVE SUMMARY:\*\*\s*(.+?)(?=\*\*DETAILED ANALYSIS:\*\*|$)',
                  r'EXECUTIVE SUMMARY:\s*(.+?)(?=DETAILED ANALYSIS:|$)',
                  r'Executive Summary:\s*(.+?)(?=Details:|Detailed Analysis:|$)'
              ]
              
              for pattern in exec_patterns:
                  match = re.search(pattern, full_response, re.DOTALL | re.IGNORECASE)
                  if match:
                      executive_summary = match.group(1).strip()
                      break
              
              # Look for detailed analysis
              detail_patterns = [
                  r'\*\*DETAILED ANALYSIS:\*\*\s*(.+?)$',
                  r'DETAILED ANALYSIS:\s*(.+?)$',
                  r'Details:\s*(.+?)$',
                  r'Detailed Analysis:\s*(.+?)$'
              ]
              
              for pattern in detail_patterns:
                  match = re.search(pattern, full_response, re.DOTALL | re.IGNORECASE)
                  if match:
                      detailed_analysis = match.group(1).strip()
                      break
              
              # If structured parsing failed, use the whole response as summary
              if not executive_summary and not detailed_analysis:
                  print("⚠️ Structured parsing failed, using full response")
                  if len(full_response) > 200:
                      executive_summary = full_response[:200] + "..."
                      detailed_analysis = full_response
                  else:
                      executive_summary = full_response
                      detailed_analysis = "See full response above."
              elif not executive_summary:
                  executive_summary = "Analysis provided in details section"
              elif not detailed_analysis:
                  detailed_analysis = "No specific detailed analysis found"
              
              print(f"📝 Extracted executive summary: {len(executive_summary)} chars")
              print(f"📋 Extracted detailed analysis: {len(detailed_analysis)} chars")
              
              # Create comment body
              timestamp = datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')
              
              comment_body = "## 🤖 AI Code Review\n\n"
              comment_body += "### Executive Summary\n"
              comment_body += f"{executive_summary}\n\n"
              comment_body += "### Details\n"
              comment_body += f"{detailed_analysis}\n\n"
              comment_body += "---\n\n"
              comment_body += "**Analysis Metadata:**\n"
              comment_body += f"- Model: `{model_used}`\n"
              comment_body += f"- Generated: {timestamp}\n"
              comment_body += f"- Diff size: {diff_size} characters\n\n"
              comment_body += "<details>\n"
              comment_body += "<summary>📋 Full LLM Response</summary>\n\n"
              comment_body += "```\n"
              comment_body += f"{full_response}\n"
              comment_body += "```\n\n"
              comment_body += "</details>\n\n"
              comment_body += "> This analysis was automatically generated by an AI model. Please review the changes manually for accuracy and completeness."
              
              # Create JSON payload for GitHub API
              comment_json = {"body": comment_body}
              
              # Write to file
              with open('comment_body.json', 'w') as f:
                  json.dump(comment_json, f, ensure_ascii=False, indent=2)
              
              print("✅ Comment body created successfully")
              
          except Exception as e:
              print(f"❌ Error processing LLM response: {e}")
              
              # Create fallback comment
              fallback_comment = {
                  "body": f"## 🤖 AI Code Review\n\n❌ **Error processing LLM response**\n\nThere was an issue parsing the AI analysis. Please check the workflow logs for details.\n\nError: `{str(e)}`\n\n> This is an automated message from the AI code review workflow."
              }
              
              with open('comment_body.json', 'w') as f:
                  json.dump(fallback_comment, f, ensure_ascii=False, indent=2)
              
              print("⚠️ Created fallback comment due to processing error")
          
          PYTHON_EOF
          
          # Check if comment body was created
          if [ ! -f comment_body.json ]; then
            echo "❌ Failed to create comment body"
            exit 1
          fi
          
          echo "📤 Posting comment to GitHub..."
          
          # Post the comment using GitHub API
          api_response=$(curl -s -w "HTTPSTATUS:%{http_code}" -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/comments" \
            -d @comment_body.json)
          
          # Extract HTTP status code
          http_code=$(echo "$api_response" | grep -o "HTTPSTATUS:[0-9]*" | cut -d: -f2)
          response_body=$(echo "$api_response" | sed 's/HTTPSTATUS:[0-9]*$//')
          
          echo "GitHub API HTTP Status: $http_code"
          echo "GitHub API Response: $response_body"
          
          # Check if comment was posted successfully
          if [ "$http_code" -eq 201 ]; then
            echo "✅ Comment posted successfully!"
            
            # Try to extract comment URL
            comment_url=$(echo "$response_body" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                print(data.get('html_url', 'URL not found'))
            except:
                print('Could not parse response for URL')
            " 2>/dev/null || echo "URL extraction failed")
            
            echo "Comment URL: $comment_url"
          else
            echo "❌ Failed to post comment (HTTP $http_code)"
            echo "Response: $response_body"
            
            # Don't exit with error for comment posting failures
            echo "⚠️ Comment posting failed, but continuing workflow..."
          fi
      
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up Ollama service..."
          docker stop ollama-service || true
          docker rm ollama-service || true
          
          echo "🧹 Cleaning up temporary files..."
          rm -f pr_diff.txt || true
          rm -f prompt.txt || true
          rm -f payload.json || true
          rm -f comment_body.json || true
          rm -f comment_data.txt || true
          rm -f llm_response.json || true
          rm -f action_rules_formatted.txt || true
